<div class="dashboard">
  <h2>Pending Service Requests</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of requests">
        <td>{{ item.id }}</td>
        <td>{{ item.status }}</td>
        <td><button>Update</button></td>
      </tr>
    </tbody>
  </table>
</div>
